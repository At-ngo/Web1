<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm sản phẩm</title>
    <link rel="stylesheet" href="../cssadmin/admin.css">
    <link rel="stylesheet" href="../cssadmin/insert_product.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <!-- HEADER -->
    <header class="header">
        <a class="logo" href="../admin/admin_dashboard.html">
            <p class="demo" style="margin-left: 1vw;">ĐỒNG HỒ</p>
        </a>

        <section class="search-bar">
            <input type="text" placeholder="Tìm kiếm sản phẩm...">
            <button type="button">Tìm kiếm</button>
        </section>

        <nav>
            <ul>
                <li><a href="#"><img src="../img/email.png" width="40" height="30" title="Gmail"></a></li>
                <li><a href="#"><img src="../img/bell.png" width="30" height="30" title="Thông báo"></a></li>
                <li><a href="#"><img src="../img/messenger.png" width="35" height="30" title="Tin nhắn"></a></li>
                <li><a href="#"><img src="../img/user.png" width="35" height="30">ADMIN</a></li>
            </ul>
        </nav>
    </header>

    <div class="main_container">
        <!-- SIDEBAR -->
        <nav class="sidebar">
            <ul>
                <li><a href="admin_dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="admin_users.html"><i class="fas fa-users"></i> Khách hàng</a></li>
                <li><a href="admin_orders.html"><i class="fas fa-shopping-cart"></i> Đơn hàng</a></li>
                <li><a href="admin_product_brands.html"><i class="fas fa-tags"></i> Nhãn hiệu</a></li>
                <li><a href="admin_product.html" class="active"><i class="fas fa-box"></i> Sản phẩm</a></li>
            </ul>
        </nav>

        <!-- MAIN CONTENT -->
        <div class="content">
            <div class="box">
                <i class="fas fa-plus-circle"></i> Thêm sản phẩm mới
                <button class="exit-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <a href="admin_product.html" style="color: white; text-decoration: none;">Thoát</a>
                </button>
            </div>

            <div class="edit-container">
                <form class="edit-form" action="#" method="post" enctype="multipart/form-data">
                    <!-- Mã sản phẩm -->
                    <div class="form-group">
                        <label for="productId">Mã sản phẩm:</label>
                        <input type="text" id="productId" name="productId" placeholder="VD: SP003" required>
                    </div>

                    <!-- Tên sản phẩm -->
                    <div class="form-group">
                        <label for="productName">Tên sản phẩm:</label>
                        <input type="text" id="productName" name="productName" placeholder="Nhập tên sản phẩm..." required>
                    </div>

                    <!-- Mã nhãn hiệu -->
                    <div class="form-group">
                        <label for="brandId">Mã nhãn hiệu:</label>
                        <input type="text" id="brandId" name="brandId" placeholder="VD: BR001" required>
                    </div>

                    <!-- Giá bán -->
                    <div class="form-group">
                        <label for="price">Giá bán:</label>
                        <input type="text" id="price" name="price" placeholder="VD: 1.200.000đ" required>
                    </div>

                    <!-- Số lượng -->
                    <div class="form-group">
                        <label for="quantity">Số lượng:</label>
                        <input type="number" id="quantity" name="quantity" placeholder="VD: 25" required>
                    </div>

                    <!-- Mô tả -->
                    <div class="form-group">
                        <label for="description">Mô tả:</label>
                        <textarea id="description" name="description" rows="4" placeholder="Nhập mô tả sản phẩm..."></textarea>
                    </div>

                    <!-- Ảnh -->
                    <div class="form-group">
                        <label for="image">Ảnh sản phẩm:</label>
                        <input type="file" id="image" name="image" accept="image/*" required>
                    </div>

                    <!-- Trạng thái -->
                    <div class="form-group">
                        <label for="status">Trạng thái:</label>
                        <select id="status" name="status">
                            <option value="active" selected>Đang bán</option>
                            <option value="inactive">Ngừng bán</option>
                        </select>
                    </div>

                    <!-- Nút lưu & hủy -->
                    <div class="form-buttons">
                        <a href="admin_product.html" class="save-btn">
                            <i class="fas fa-save"></i> Lưu sản phẩm
                        </a>
                        <a href="admin_product.html" class="delete-btn">
                            <i class="fas fa-times"></i> Hủy bỏ
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
