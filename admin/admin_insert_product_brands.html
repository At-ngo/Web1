<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm nhãn hiệu sản phẩm</title>
    <link rel="stylesheet" href="../cssadmin/admin.css">
    <link rel="stylesheet" href="../cssadmin/insert_product_brands.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <!-- HEADER -->
    <header class="header">
        <a class="logo" href="../admin/admin_dashboard.html">
            <p class="demo" style="margin-left: 1vw;">ĐỒNG HỒ</p>
        </a>

        <section class="search-bar">
            <input type="text" placeholder="Tìm kiếm nhãn hiệu...">
            <button type="button">Tìm kiếm</button>
        </section>

        <nav>
            <ul>
                <li><a href="admin_gmail.html"><img src="../img/email.png" width="40" height="30" title="Gmail"></a></li>
                <li><a href="admin_notification.html"><img src="../img/bell.png" width="30" height="30" title="Thông báo"></a></li>
                <li><a href="#"><img src="../img/messenger.png" width="35" height="30" title="Tin nhắn"></a></li>
                <li><a href="admin_info.html"><img src="../img/user.png" width="35" height="30">ADMIN</a></li>
            </ul>
        </nav>
    </header>

    <div class="main_container">
        <!-- SIDEBAR -->
        <nav class="sidebar">
            <ul>
                <li><a href="admin_dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="admin_users.html"><i class="fas fa-users"></i> Khách hàng</a></li>
                <li><a href="admin_orders.html"><i class="fas fa-shopping-cart"></i> Đơn hàng</a></li>
                <li><a href="admin_product_brands.html"><i class="fas fa-tags"></i> Nhãn hiệu</a></li>
                <li><a href="admin_product.html"><i class="fas fa-box"></i> Sản phẩm</a></li>
            </ul>
        </nav>

        <!-- MAIN CONTENT -->
        <div class="content">
            <div class="box">
                <i class="fas fa-plus-circle"></i> Thêm nhãn hiệu sản phẩm
                <button class="exit-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <a href="admin_product_brands.html" style="color: white; text-decoration: none;">Thoát</a>
                </button>
            </div>

            <div class="edit-container">
                <form class="edit-form" action="#" method="post" enctype="multipart/form-data">
                    <!-- Mã nhãn hiệu -->
                    <!-- <div class="form-group">
                        <label for="brandId">Mã nhãn hiệu:</label>
                        <input type="text" id="brandId" name="brandId" placeholder="Ví dụ: BR004" required>
                    </div> -->

                    <!-- Tên nhãn hiệu -->
                    <div class="form-group">
                        <label for="brandName">Tên nhãn hiệu: <span style="color:red">*</span></label>
                        <input type="text" id="brandName" name="brandName" placeholder="Nhập tên nhãn hiệu..." required>
                    </div>

                    <!-- Ngày tạo -->
                    <!-- <div class="form-group">
                        <label for="createDate">Ngày tạo:</label>
                        <input type="date" id="createDate" name="createDate" required>
                    </div> -->

                    <!-- Logo -->
                    <div class="form-group image-group">
                        <label class="form-label">Hình ảnh sản phẩm <span style="color:red">*</span></label>

                        <div class="image-container">
                            <div class="image-preview" id="imagePreview">
                                <span class="image-upload-text">
                                    <i class="fas fa-image"></i>
                                    <p>Chưa có ảnh</p>
                                </span>
                            </div>
                            <input type="file" id="productImage" name="productImage" accept="image/*">
                        </div>
                    </div>

                    <script>
                        const fileInput = document.getElementById("productImage");
                        const preview = document.getElementById("imagePreview");

                        fileInput.addEventListener("change", (event) => {
                            const file = event.target.files[0];
                            if (file) {
                                const reader = new FileReader();
                                reader.onload = (e) => {
                                    preview.style.backgroundImage = `url(${e.target.result})`;
                                    preview.classList.add("has-image");
                                    preview.innerHTML = "";
                                };
                                reader.readAsDataURL(file);
                            } else {
                                preview.style.backgroundImage = "";
                                preview.classList.remove("has-image");
                                preview.innerHTML = `<span class="image-upload-text"><i class="fas fa-image"></i><p>Chưa có ảnh</p></span>`;
                            }
                        });
                    </script>


                    <!-- Nút lưu & hủy -->
                    <div class="form-buttons">
                        <!-- Use label to trigger a success popup (CSS-only) -->
                        <label for="popup-success-save" class="save-btn"
                            style="cursor: pointer; display: inline-flex; align-items: center; gap:8px;">
                            <i class="fas fa-save"></i> Lưu nhãn hiệu
                        </label>
                        <a href="admin_product_brands.html" class="delete-btn">
                            <i class="fas fa-times"></i> Hủy bỏ
                        </a>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- Success popup for save action -->
    <input type="checkbox" id="popup-success-save" />
    <div class="popup-overlay success-save">
        <div class="popup-content">
            <h2><i class="fa-solid fa-check-circle" style="color: #007bff"></i> Thông báo</h2>
            <p style="white-space: nowrap; margin-top: 3vh;">Lưu nhãn hiệu thành công</p>
            <a href="admin_product_brands.html" class="close-popup"
                style="background-color: #007bff; color: white;">OK</a>
        </div>
    </div>
</body>

</html>
