<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chỉnh sửa nhãn hiệu sản phẩm</title>
    <link rel="stylesheet" href="../cssadmin/admin.css">
    <link rel="stylesheet" href="../cssadmin/edit_product_brands.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <!-- HEADER -->
    <header class="header">
        <a class="logo" href="../admin/admin_dashboard.html">
            <p class="demo" style="margin-left: 1vw;">ĐỒNG HỒ</p>
        </a>

        <section class="search-bar">
            <input type="text" placeholder="Tìm kiếm nhãn hiệu...">
            <button type="button">Tìm kiếm</button>
        </section>

        <nav>
            <ul>
                <li><a href="#"><img src="../img/email.png" width="40" height="30" title="Gmail"></a></li>
                <li><a href="#"><img src="../img/bell.png" width="30" height="30" title="Thông báo"></a></li>
                <li><a href="#"><img src="../img/messenger.png" width="35" height="30" title="Tin nhắn"></a></li>
                <li><a href="#"><img src="../img/user.png" width="35" height="30">ADMIN</a></li>
            </ul>
        </nav>
    </header>

    <div class="main_container">
        <!-- SIDEBAR -->
        <nav class="sidebar">
            <ul>
                <li><a href="admin_dashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                <li><a href="admin_users.html"><i class="fas fa-users"></i> Khách hàng</a></li>
                <li><a href="admin_orders.html"><i class="fas fa-shopping-cart"></i> Đơn hàng</a></li>
                <li><a href="admin_product_brands.html"><i class="fas fa-tags"></i> Nhãn hiệu</a></li>
                <li><a href="admin_product.html"><i class="fas fa-box"></i> Sản phẩm</a></li>
            </ul>
        </nav>

        <!-- MAIN CONTENT -->
        <div class="content">
            <div class="box">
                <i class="fas fa-edit"></i> Chỉnh sửa nhãn hiệu sản phẩm
                <button class="exit-btn">
                    <i class="fas fa-sign-out-alt"></i>
                    <a href="admin_product_brands.html" style="color: white; text-decoration: none;">Thoát</a>
                </button>
            </div>

            <div class="edit-container">
                <form class="edit-form" action="#" method="post" enctype="multipart/form-data">
                    <!-- Mã nhãn hiệu -->
                    <div class="form-group">
                        <label for="brandId">Mã nhãn hiệu:</label>
                        <input type="text" id="brandId" name="brandId" value="BR002" readonly>
                    </div>

                    <!-- Tên nhãn hiệu -->
                    <div class="form-group">
                        <label for="brandName">Tên nhãn hiệu:</label>
                        <input type="text" id="brandName" name="brandName" value="Rolex" required>
                    </div>

                    <!-- Ngày tạo -->
                    <!-- <div class="form-group">
                        <label for="createDate">Ngày tạo:</label>
                        <input type="date" id="createDate" name="createDate" value="2020-06-25" required>
                    </div> -->

                    <!-- Logo hiện tại -->
                    <div class="form-group">
                        <label>Logo hiện tại:</label>
                        <img src="../img/rolex.png" width="120" style="border-radius:8px; border:1px solid #ccc;">
                    </div>

                    <!-- Thay logo mới -->
                    <div class="form-group image-group">
                        <label for="logo">Thay logo mới:</label>

                        <div class="image-container">
                            <div class="image-preview" id="imagePreview">
                                <span class="image-upload-text">
                                    <i class="fas fa-image"></i>
                                    <p>Chưa có ảnh mới</p>
                                </span>
                            </div>
                            <input type="file" id="logo" name="logo" accept="image/*">
                        </div>
                    </div>

                    <script>
                        const fileInput = document.getElementById("logo");
                        const preview = document.getElementById("imagePreview");

                        fileInput.addEventListener("change", (event) => {
                            const file = event.target.files[0];
                            if (file) {
                                const reader = new FileReader();
                                reader.onload = (e) => {
                                    preview.style.backgroundImage = `url(${e.target.result})`;
                                    preview.classList.add("has-image");
                                    preview.innerHTML = "";
                                };
                                reader.readAsDataURL(file);
                            } else {
                                preview.style.backgroundImage = "";
                                preview.classList.remove("has-image");
                                preview.innerHTML = `<span class="image-upload-text"><i class='fas fa-image'></i><p>Chưa có ảnh mới</p></span>`;
                            }
                        });
                    </script>


                    <!-- Nút cập nhật & xóa -->
                    <div class="form-buttons">
                        <!-- label triggers update success popup -->
                        <label for="popup-success-update" class="save-btn"
                            style="cursor:pointer; display:inline-flex; align-items:center; gap:8px;">
                            <i class="fas fa-save"></i> Cập nhật thông tin
                        </label>
                        <!-- label triggers delete confirmation popup first -->
                        <label for="popup-delete-confirm" class="delete-btn"
                            style="cursor:pointer; display:inline-flex; align-items:center; gap:8px;">
                            <i class="fas fa-trash"></i> Xóa nhãn hiệu
                        </label>
                    </div>

                </form>
            </div>
        </div>
    </div>

    <!-- Success popups for update and delete actions -->
    <input type="checkbox" id="popup-success-update" />
    <div class="popup-overlay success-update">
        <div class="popup-content">
            <h2><i class="fa-solid fa-check-circle" style="color: #007bff"></i> Thông báo</h2>
            <p style="white-space: nowrap; margin-top: 3vh;">Cập nhật nhãn hiệu thành công</p>
            <a href="admin_product_brands.html" class="close-popup"
                style="background-color: #007bff; color: white;">OK</a>
        </div>
    </div>
    <!-- Delete confirmation popup (opens first). Confirm will trigger the existing success checkbox below -->
    <input type="checkbox" id="popup-delete-confirm" />
    <div class="popup-overlay confirm-delete">
        <div class="popup-content">
            <h2>Xác nhận</h2>
            <p>Bạn có chắc muốn xóa nhãn hiệu này?</p>
            <div style="margin-top:18px; display:flex; gap:12px; justify-content:center;">
                <label for="popup-delete-confirm" class="close-popup"
                    style="background:#6c757d; color:#fff;">Hủy</label>
                <!-- confirm opens the success popup checkbox that already exists further below -->
                <label for="popup-success-delete-edit" class="close-popup" style="background:#007bff; color:#fff;">Xác
                    nhận</label>
            </div>
        </div>
    </div>

    <input type="checkbox" id="popup-success-delete-edit" />
    <div class="popup-overlay success-delete-edit">
        <div class="popup-content">
            <h2><i class="fa-solid fa-check-circle" style="color: red"></i> Thông báo</h2>
            <p style="white-space: nowrap; margin-top: 3vh;">Đã xóa nhãn hiệu thành công</p>
            <a href="admin_product_brands.html" class="close-popup"
                style="background-color: #007bff; color: white;">OK</a>
        </div>
    </div>
</body>

</html>
