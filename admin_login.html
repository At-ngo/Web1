<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="cssadmin/loginadmin.css">
</head>

<body>
    <div class="login-box">
        <h2>Đăng Nhập Quản Trị</h2>

        <!-- Email Input -->
        <div class="input-group">
            <label for="email">Tên tài khoản</label>
            <input type="email" id="email" placeholder="Nhập tài khoản" required>
        </div>

        <!-- Password Input -->
        <div class="input-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" placeholder="Nhập mật khẩu" required>
        </div>

        <!-- Login Button -->
        <a style="text-decoration: none; color: white ;" href="admin/admin_dashboard.html">
            <button class="login-btn" type="submit">Đăng Nhập</button>
        </a>


    </div>
</body>

</html>
